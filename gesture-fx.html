<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture FX</title>
<style>
  :root{
    --bg:#0e0f14; --panel:rgba(18,19,26,.94); --line:#2a2c38; --text:#e8e9f0; --muted:#8b8ea3;
    --accent:#7c5cff; --accent2:#34e1ff; --danger:#ff4d6d; --ok:#3bceac;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--text);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body.solid{background:var(--bg)}
  canvas#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #video{display:none}
  #hud{position:fixed;left:10px;top:10px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.55);
    font:12px/1.4 ui-monospace,Consolas,monospace;pointer-events:none;white-space:pre}
  #gear{position:fixed;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}
  #panel{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100vw;background:var(--panel);
    border-left:1px solid var(--line);display:flex;flex-direction:column;backdrop-filter:blur(8px)}
  .hidden{display:none!important}
  #panel header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  #panel header b{font-size:15px;flex:1}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:10px 4px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font:inherit}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .body{flex:1;overflow:auto;padding:12px 14px 40px}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:rgba(255,255,255,.02)}
  .card.off{opacity:.5}
  .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
  .row label{color:var(--muted);min-width:90px}
  .grow{flex:1;min-width:0}
  input,select,textarea{background:#1b1d27;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 7px;font:inherit}
  input[type=number]{width:80px}
  input[type=color]{width:42px;height:28px;padding:1px}
  input[type=range]{flex:1}
  textarea{width:100%;min-height:90px;font:11px ui-monospace,Consolas,monospace}
  button.b{background:#232633;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
  button.b:hover{border-color:var(--accent)}
  button.p{background:var(--accent);border-color:var(--accent)}
  button.d{color:var(--danger)}
  button.i{padding:4px 8px}
  h3{margin:14px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .hint{color:var(--muted);font-size:12px;margin:6px 0}
  .pill{display:inline-block;padding:1px 7px;border-radius:99px;background:#232633;color:var(--muted);font-size:11px}
  .live{font:11px ui-monospace,Consolas,monospace}
  .live.hit{color:var(--ok)}
  .st-ok{color:var(--ok)} .st-err{color:var(--danger)}
  .fxgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fxgrid .card{margin:0;display:flex;flex-direction:column;gap:6px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#232633;border:1px solid var(--line);
    padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  code{background:#1b1d27;padding:1px 5px;border-radius:4px}
  /* поле «Эмодзи»: фишки разобранных эмодзи + выбор из полного набора */
  .efield{flex:1;min-width:0}
  .efield .row{margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .chip{padding:1px 6px;border-radius:6px;background:#232633;border:1px solid var(--line);cursor:pointer;
    font:16px/1.3 "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
  .chip:hover{border-color:var(--danger)}
  .etabs{display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .etabs button.b{width:30px;height:30px;padding:0;font-size:16px}
  .etabs button.on{background:var(--accent);border-color:var(--accent)}
  .egrid{display:flex;flex-wrap:wrap;gap:1px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px;margin-top:6px;background:#1b1d27}
  .egrid button{width:32px;height:32px;border:0;background:none;border-radius:6px;cursor:pointer;padding:0;
    font:20px/32px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
  .egrid button:hover{background:#2c3040}
  /* картинки, GIF и видео — отдельный слой поверх canvas, браузер анимирует их сам */
  #media{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #media img,#media video{position:absolute;left:0;top:0;height:auto;will-change:transform,opacity}
  .mthumb{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:#1b1d27;border:1px solid var(--line);border-radius:6px;overflow:hidden;color:var(--muted)}
  .mthumb img,.mthumb video{width:40px;height:40px;object-fit:contain}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mgrid .card{margin:0;display:flex;flex-direction:column;gap:4px}
  .mgrid .mth{width:100%;height:90px;object-fit:contain;background:#1b1d27;border-radius:6px}
  .mname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs button{padding:10px 2px;font-size:12px}
  /* живые полоски значений («ручки», порог своих жестов) */
  .bar{position:relative;height:6px;border-radius:3px;background:#232633;flex:1;min-width:60px;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
  .bar.on i{background:var(--ok)}
  .steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .steps select{max-width:150px}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="stage"></canvas>
<div id="media"></div>
<div id="hud"></div>
<button id="gear" title="Настройки (H)">⚙</button>
<div id="panel" class="hidden">
  <header><b>Gesture FX</b><span class="pill">H — скрыть</span><button class="b i" id="close">✕</button></header>
  <div class="tabs">
    <button data-tab="rules" class="on">Правила</button>
    <button data-tab="custom">Жесты</button>
    <button data-tab="knobs">Ручки</button>
    <button data-tab="library">Библиотека</button>
    <button data-tab="settings">Настройки</button>
  </div>
  <div class="body" id="tab-rules"></div>
  <div class="body hidden" id="tab-custom"></div>
  <div class="body hidden" id="tab-knobs"></div>
  <div class="body hidden" id="tab-library"></div>
  <div class="body hidden" id="tab-settings"></div>
</div>
<div id="toast"></div>
<datalist id="dl-obs-scenes"></datalist><datalist id="dl-obs-sources"></datalist><datalist id="dl-obs-inputs"></datalist>

<script type="module">
// ====================== Константы ======================
const MP_VER = '1.2.0';
const CDN = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const STORE_KEY = 'gesturefx.config.v1';
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

// group: hand — поза руки, dyn — движение руки, face — лицо (нужна модель лица), pose — тело (модель позы).
// event — одноразовое событие (свайп, кивок…): срабатывает сразу, «удержание» в правиле не используется.
const BUILTIN = {
  Thumb_Up:       {name:'Палец вверх',        icon:'👍', group:'hand'},
  Thumb_Down:     {name:'Палец вниз',         icon:'👎', group:'hand'},
  Victory:        {name:'Виктори',            icon:'✌️', group:'hand'},
  Open_Palm:      {name:'Ладонь',             icon:'✋', group:'hand'},
  Closed_Fist:    {name:'Кулак',              icon:'✊', group:'hand'},
  Pointing_Up:    {name:'Указательный вверх', icon:'☝️', group:'hand'},
  ILoveYou:       {name:'Я тебя люблю',       icon:'🤟', group:'hand'},
  Finger_Heart:   {name:'Сердечко пальцами',  icon:'🫰', group:'hand'},
  Two_Hand_Heart: {name:'Сердце двумя руками',icon:'🫶', group:'hand'},
  Swipe_Left:     {name:'Свайп влево',        icon:'👈', group:'dyn', event:true},
  Swipe_Right:    {name:'Свайп вправо',       icon:'👉', group:'dyn', event:true},
  Swipe_Up:       {name:'Свайп вверх',        icon:'👆', group:'dyn', event:true},
  Swipe_Down:     {name:'Свайп вниз',         icon:'👇', group:'dyn', event:true},
  Circle_CW:      {name:'Круг по часовой',    icon:'🔃', group:'dyn', event:true},
  Circle_CCW:     {name:'Круг против часовой',icon:'🔄', group:'dyn', event:true},
  Throw:          {name:'Бросок (кулак → раскрыть в движении)', icon:'🤾', group:'dyn', event:true},
  Facepalm:       {name:'Фейспалм (ладонь на лице)', icon:'🤦', group:'face'},
  Face_MouthOpen: {name:'Открытый рот',       icon:'😮', group:'face'},
  Face_Smile:     {name:'Улыбка',             icon:'😁', group:'face'},
  Face_BrowsUp:   {name:'Поднятые брови',     icon:'🤨', group:'face'},
  Face_Frown:     {name:'Нахмуренные брови',  icon:'😠', group:'face'},
  Face_Wink:      {name:'Подмигивание',       icon:'😉', group:'face'},
  Face_Kiss:      {name:'Губы трубочкой',     icon:'😘', group:'face'},
  Face_Puff:      {name:'Надутые щёки',       icon:'🐡', group:'face'},
  Face_Nod:       {name:'Кивок',              icon:'↕️', group:'face', event:true},
  Face_Shake:     {name:'Мотание головой',    icon:'↔️', group:'face', event:true},
  Pose_Shrug:     {name:'Пожать плечами',     icon:'🤷', group:'pose'},
  Pose_ArmsCrossed:{name:'Скрещённые руки',   icon:'🙅', group:'pose'},
  Pose_HandsUp:   {name:'Руки вверх',         icon:'🙌', group:'pose'},
  Pose_TPose:     {name:'Руки в стороны',     icon:'🤸', group:'pose'},
};
const GROUP_NAMES = {hand:'Рука', dyn:'Движение', face:'Лицо', pose:'Тело'};

const SOUNDS = {none:'без звука', pop:'поп', chime:'дзынь', boom:'бум', whoosh:'вжух', zap:'разряд'};

// ====================== Утилиты ======================
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(v===true) e.setAttribute(k,'');
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const k of kids.flat()) if(k!=null) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}

// ====================== Эмодзи ======================
// Любой стандартный эмодзи — одна «фишка»: составные (👨‍👩‍👧, 🏳️‍🌈, 👍🏽, 🇷🇺, 1️⃣) не разваливаются на части.
const SEG = typeof Intl!=='undefined' && Intl.Segmenter ? new Intl.Segmenter(undefined,{granularity:'grapheme'}) : null;
const EMOJI_SEQ = /\p{Regional_Indicator}{2}|(?:\p{Extended_Pictographic}|\p{Emoji_Presentation}|[0-9#*]\uFE0F?\u20E3)(?:\p{Emoji_Modifier}|\uFE0F|\u20E3|[\u{E0020}-\u{E007F}])*(?:\u200D(?:\p{Extended_Pictographic}|\p{Emoji_Presentation})(?:\p{Emoji_Modifier}|\uFE0F)*)*/gu;
const isEmoji = s => /\p{Extended_Pictographic}|\p{Emoji_Presentation}|\u20E3/u.test(s);
function graphemes(str){
  if(SEG) return Array.from(SEG.segment(str), s=>s.segment);
  const out=[]; let last=0;   // запасной вариант без Intl.Segmenter
  for(const m of str.matchAll(EMOJI_SEQ)){ out.push(...str.slice(last,m.index)); out.push(m[0]); last=m.index+m[0].length; }
  out.push(...str.slice(last)); return out;
}
// Разбирает поле «Эмодзи»: каждый эмодзи — отдельный элемент (пробелы не обязательны), обычный текст — по словам.
function emojiTokens(str, fallback=[]){
  const out=[]; let word='';
  const flush=()=>{ if(word){ out.push(word); word=''; } };
  for(const gr of graphemes(String(str??''))){
    if(/^\s+$/.test(gr)) flush();
    else if(isEmoji(gr)){ flush(); out.push(gr); }
    else word+=gr;
  }
  flush(); return out.length?out:fallback;
}
const TONES=['','\u{1F3FB}','\u{1F3FC}','\u{1F3FD}','\u{1F3FE}','\u{1F3FF}'];
// Оттенок кожи: модификатор ставится после каждой «основы» (👋 → 👋🏽, 👩‍💻 → 👩🏽‍💻). Если шрифт такую
// комбинацию не знает (например, семьи), остаётся исходный эмодзи.
function withTone(e, tone){
  if(!tone||!/\p{Emoji_Modifier_Base}/u.test(e)) return e;
  const t=e.replace(/(\p{Emoji_Modifier_Base})\uFE0F?/gu,(m,b)=>b+tone);
  return emojiRenders(t)?t:e;
}
// Умеет ли шрифт этот эмодзи: незнакомую составную последовательность он рисует несколькими глифами
// (заметно шире одного), незнакомый одиночный — чёрным «квадратиком» без цвета.
const renderCache=new Map(); let probe=null, probeColor=null;
function emojiRenders(e){
  let r=renderCache.get(e); if(r!=null) return r;
  try{
    if(!probe){ probe=document.createElement('canvas'); probe.width=probe.height=40; probe.g=probe.getContext('2d',{willReadFrequently:true}); }
    const c=probe.g; c.font=`24px ${EMOJI_FONT}`; c.textBaseline='top'; c.fillStyle='#000';
    const colored=s=>{ c.clearRect(0,0,40,40); c.fillText(s,2,4); const d=c.getImageData(0,0,40,40).data;
      for(let i=0;i<d.length;i+=4) if(d[i+3]>0&&(d[i]|d[i+1]|d[i+2])) return true; return false; };
    const ref=c.measureText('\u{1F600}').width; if(probeColor==null) probeColor=colored('\u{1F600}');
    const w=c.measureText(e).width;
    r = w>0 && w<ref*1.45 && (!probeColor||colored(e));
  }catch{ r=true; }
  renderCache.set(e,r); return r;
}
// Полный стандартный набор: Unicode 16.0 (emoji-test.txt, fully-qualified), порядок как на системных клавиатурах.
// Варианты с оттенком кожи не хранятся — их даёт withTone().
const EMOJI_GROUPS=[
  ["😀","Смайлы и эмоции",

function groupEmoji(i, tone){
  const key=i+':'+tone; let r=groupCache.get(key); if(r) return r;
  let base=groupCache.get(i); if(!base){ base=emojiTokens(EMOJI_GROUPS[i][2]); groupCache.set(i,base); }
  const list=[]; let hidden=0;
  for(const e of base){ if(!emojiRenders(e)){ hidden++; continue; } list.push(tone?withTone(e,tone):e); }
  r={list,hidden}; groupCache.set(key,r); return r;
}

// ====================== Медиа: картинки, GIF, видео ======================
// Показываются DOM-элементами в слое #media (canvas у GIF рисует только первый кадр).
// Источники: загруженный файл (IndexedDB, ссылка вида media:<id>), путь рядом с html или URL.
const mediaLayer=$('#media');
const mediaDB={db:null,items:[],urls:new Map(),seq:0};
function idb(){ if(mediaDB.db) return Promise.resolve(mediaDB.db);
  return new Promise((res,rej)=>{ const r=indexedDB.open('gesturefx',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});
    r.onsuccess=()=>{ mediaDB.db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }); }
function idbReq(mode,fn){ return idb().then(db=>new Promise((res,rej)=>{ const rq=fn(db.transaction('media',mode).objectStore('media'));
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }
async function mediaLoad(){ try{ mediaDB.items=(await idbReq('readonly',s=>s.getAll())).sort((a,b)=>a.added-b.added); }catch(e){ console.warn('IndexedDB недоступен',e); } }
async function mediaAdd(file){
  const rec={id:uid(),name:file.name,type:file.type||'',size:file.size,blob:file,added:Date.now()};
  await idbReq('readwrite',s=>s.put(rec)); mediaDB.items.push(rec); return rec;
}
async function mediaDel(id){
  await idbReq('readwrite',s=>s.delete(id)); mediaDB.items=mediaDB.items.filter(x=>x.id!==id);
  const u=mediaDB.urls.get(id); if(u){ URL.revokeObjectURL(u); mediaDB.urls.delete(id); }
}
const mediaItem=id=>mediaDB.items.find(x=>x.id===id);
const isVideoName=s=>/\.(webm|mp4|m4v|mov|ogv)(\?|#|$)/i.test(s);
const fmtSize=b=>b>=1e6?(b/1e6).toFixed(1)+' МБ':Math.round(b/1e3)+' КБ';
// ссылка из правила -> {url, blob?, video, name} или null
function mediaResolve(ref){
  ref=String(ref||'').trim(); if(!ref) return null;
  if(ref.startsWith('media:')){ const it=mediaItem(ref.slice(6)); if(!it) return null;
    let u=mediaDB.urls.get(it.id); if(!u){ u=URL.createObjectURL(it.blob); mediaDB.urls.set(it.id,u); }
    return {url:u,blob:it.blob,video:it.type.startsWith('video/')||isVideoName(it.name),name:it.name}; }
  return {url:ref,video:isVideoName(ref),name:ref.split(/[\\/]/).pop()};
}
// Создаёт img/video. fresh=true — для показа в эфире: новый ресурс, чтобы GIF начинался с первого кадра
// (браузер синхронизирует анимацию у всех картинок с одним URL).
function mediaEl(m,fresh){
  let url=m.url, revoke=null;
  if(fresh){ if(m.blob){ url=URL.createObjectURL(m.blob); revoke=url; }
    else if(!/^(data|blob):/.test(url)) url+=(url.includes('?')?'&':'?')+'gfx='+(++mediaDB.seq); }
  let e;
  if(m.video){ e=document.createElement('video'); e.muted=true; e.loop=true; e.autoplay=true; e.playsInline=true; e.src=url; e.play().catch(()=>{}); }
  else { e=document.createElement('img'); e.decoding='async'; e.src=url; }
  e.onerror=()=>{ if(fresh) toast('Не удалось загрузить: '+m.name); };
  if(revoke) e.addEventListener('gfx-dispose',()=>URL.revokeObjectURL(revoke));
  return e;
}
const preloaded=new Set();
function mediaPreload(ref){ const m=mediaResolve(ref); if(!m||m.blob||m.video||preloaded.has(m.url)) return; preloaded.add(m.url); const i=new Image(); i.src=m.url; }
function preloadRuleMedia(){ for(const r of cfg.rules) if(r.enabled&&EFFECTS[r.effect]?.params?.media) mediaPreload(ruleParams(r).media); }

function heldEntity(src,maxSec,draw,update,tail=0.45){
  const demo=!activeNow.has(String(src).split('@')[0]);
  return {age:0,fade:0,held:true,life:Infinity,
    update(dt){ this.age+=dt; this.held=(isHeld(src)||(demo&&this.age<2.5))&&(!maxSec||this.age<maxSec);
      this.fade=this.held?Math.min(1,this.fade+dt/0.25):Math.max(0,this.fade-dt/tail);
      update&&update.call(this,dt); return this.held||this.fade>0; },
    draw};
}

const DRAW = {

    g.beginPath(); g.arc(this.x,this.y,this.r*(this.shrink?Math.max(0.1,1-this.age/this.life):1),0,Math.PI*2); g.fill(); g.restore(); },

function particle(o){
  o.age=0; o.delay=o.delay||0; o.fade=o.fade??0.6;
  o.update=function(dt){
    if(this.delay>0){ this.delay-=dt; return true; }
    const k=Math.exp(-(this.drag||0)*dt); this.vx*=k; this.vy*=k;
    this.vy+=(this.g||0)*dt; this.x+=this.vx*dt; this.y+=this.vy*dt;
    if(this.vr) this.rot+=this.vr*dt;
    this.age+=dt;
    return this.age<this.life && this.y<H+150 && this.y>-400;
  };
  o.draw=function(){
    if(this.delay>0) return;
    g.globalAlpha=clamp((this.life-this.age)/this.fade,0,1)*(this.alpha??1);
    DRAW[this.kind].call(this); g.globalAlpha=1;
  };
  return o;
}
function entity(life, draw, update){ return {age:0,life,update(dt){ this.age+=dt; update&&update.call(this,dt); return this.age<this.life; },draw}; }

      const pos=p.where==='center'?{x:W/2,y:H/2}:p.where==='random'?{x:rnd(W*0.15,W*0.85),y:rnd(H*0.15,H*0.85)}

  // ---------- действия в OBS (через obs-websocket) ----------
  obsScene:{name:'OBS: сменить сцену',icon:'🎬',sound:'none',obs:true,
    params:{scene:{label:'Сцена',type:'text',def:'',list:'dl-obs-scenes'},back:{label:'Вернуть через, с (0 — нет)',type:'number',def:0}},
    run(p){ obsAction(async()=>{ if(!p.scene) throw new Error('не указана сцена');
      const prev=p.back>0?await obsCurrentScene():null;
      await obsReq('SetCurrentProgramScene',{sceneName:p.scene});
      if(prev&&prev!==p.scene) setTimeout(()=>obsReq('SetCurrentProgramScene',{sceneName:prev}).catch(obsFail),p.back*1000); }); }},
  obsSource:{name:'OBS: показать/скрыть источник',icon:'👁️',sound:'none',obs:true,
    params:{source:{label:'Источник',type:'text',def:'',list:'dl-obs-sources'},
      scene:{label:'В сцене (пусто — текущая)',type:'text',def:'',list:'dl-obs-scenes'},
      mode:{label:'Действие',type:'select',options:{flash:'показать на время',toggle:'переключить',show:'показать',hide:'скрыть'},def:'flash'},
      duration:P.duration(4)},
    run(p){ obsAction(async()=>{ if(!p.source) throw new Error('не указан источник');
      const sceneName=p.scene||await obsCurrentScene();
      const {sceneItemId}=await obsReq('GetSceneItemId',{sceneName,sourceName:p.source});
      const set=v=>obsReq('SetSceneItemEnabled',{sceneName,sceneItemId,sceneItemEnabled:v});

function bolt(x1,y1,x2,y2,depth){
  let pts=[[x1,y1],[x2,y2]];
  for(let d=0; d<depth; d++){
    const out=[pts[0]];
    for(let i=1;i<pts.length;i++){ const [ax,ay]=pts[i-1],[bx,by]=pts[i]; const len=Math.hypot(bx-ax,by-ay);
      out.push([(ax+bx)/2+rnd(-1,1)*len*0.22,(ay+by)/2+rnd(-1,1)*len*0.08],[bx,by]); }
    pts=out;
  }
  return pts;
}

let actx=null;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch{ return null; } }
  if(actx.state==='suspended') actx.resume(); return actx; }
function playSound(name){
  if(!name||name==='none') return; const a=audio(); if(!a) return;
  const t=a.currentTime, out=a.createGain(); out.gain.value=cfg.settings.volume*knobState.volume; out.connect(a.destination);
  const tone=(type,f0,f1,dur,vol=0.6,delay=0)=>{ const o=a.createOscillator(), gn=a.createGain(); o.type=type;
    o.frequency.setValueAtTime(f0,t+delay); o.frequency.exponentialRampToValueAtTime(f1,t+delay+dur);
    gn.gain.setValueAtTime(vol,t+delay); gn.gain.exponentialRampToValueAtTime(0.001,t+delay+dur);
    o.connect(gn).connect(out); o.start(t+delay); o.stop(t+delay+dur+0.05); };
  const noise=(dur,f0,f1,vol,type='lowpass')=>{ const len=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1; const s=a.createBufferSource(); s.buffer=b;
    const fl=a.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f0,t); fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const gn=a.createGain(); gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(fl).connect(gn).connect(out); s.start(t); };
  switch(name){
    case 'pop': tone('sine',900,180,0.16); break;
    case 'chime': tone('sine',880,880,0.6,0.35); tone('sine',1320,1320,0.8,0.25,0.12); break;
    case 'boom': noise(0.9,900,40,1.1); tone('sine',110,38,0.6,0.8); break;
    case 'whoosh': noise(0.55,300,4500,0.7,'bandpass'); break;
    case 'zap': tone('sawtooth',1800,70,0.3,0.3); noise(0.25,7000,500,0.3,'highpass'); break;
  }
}

const obs={needPassword:false,ws:null,state:'off',err:'',ready:false,pending:new Map(),seq:0,scenes:[],inputs:[],retryT:null};
function sha256Fallback(m){ // на случай, если crypto.subtle недоступен
  const pr=[]; for(let n=2;pr.length<64;n++) if(pr.every(q=>n%q)) pr.push(n);
  const fr=x=>((x-Math.floor(x))*2**32)>>>0, K=pr.map(q=>fr(Math.cbrt(q))), h=pr.slice(0,8).map(q=>fr(Math.sqrt(q)));
  const l=m.length, bl=((l+9+63)>>6)<<6, b=new Uint8Array(bl); b.set(m); b[l]=0x80;
  const dv=new DataView(b.buffer); dv.setUint32(bl-4,(l*8)>>>0); dv.setUint32(bl-8,Math.floor(l/0x20000000));
  const w=new Uint32Array(64), r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bl;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const a=w[i-15],c=w[i-2]; w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(c,17)^r(c,19)^(c>>>10)))>>>0; }
    let [A,B,C,D,E,F,G,X]=h;
    for(let i=0;i<64;i++){ const t1=(X+(r(E,6)^r(E,11)^r(E,25))+((E&F)^(~E&G))+K[i]+w[i])>>>0, t2=((r(A,2)^r(A,13)^r(A,22))+((A&B)^(A&C)^(B&C)))>>>0;
      X=G; G=F; F=E; E=(D+t1)>>>0; D=C; C=B; B=A; A=(t1+t2)>>>0; }
    [A,B,C,D,E,F,G,X].forEach((v,i)=>h[i]=(h[i]+v)>>>0);
  }
  const out=new Uint8Array(32); h.forEach((v,i)=>{ out[i*4]=v>>>24; out[i*4+1]=(v>>>16)&255; out[i*4+2]=(v>>>8)&255; out[i*4+3]=v&255; }); return out;
}
async function sha256b64(str){
  const bytes=new TextEncoder().encode(str); let hash;
  try{ hash=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)); }catch{ hash=sha256Fallback(bytes); }
  let bin=''; for(const x of hash) bin+=String.fromCharCode(x); return btoa(bin);
}
function obsSet(state,err=''){ obs.state=state; obs.err=err; renderObsStatus(); }
function obsStatusText(){
  return {off:'выключено',connecting:'подключаюсь…',ok:`подключено · сцен: ${obs.scenes.length}`,error:obs.err||'ошибка'}[obs.state];
}
function renderObsStatus(){ const e=document.getElementById('obs-status'); if(!e) return;
  e.textContent=obsStatusText(); e.className='pill '+(obs.state==='ok'?'st-ok':obs.state==='error'?'st-err':''); }
function obsDisconnect(){ clearTimeout(obs.retryT); if(obs.ws){ const w=obs.ws; obs.ws=null; obs.ready=false; try{ w.close(); }catch{} } }
function obsRetry(){ clearTimeout(obs.retryT); if(cfg.settings.obsWs.enabled) obs.retryT=setTimeout(obsConnect,5000); }
function obsConnect(){
  obsDisconnect();
  const s=cfg.settings.obsWs; if(!s.enabled){ obsSet('off'); return; }
  let ws; try{ ws=new WebSocket(s.url,'obswebsocket.json'); }catch(e){ obsSet('error','Неверный адрес: '+e.message); return; }
  obs.ws=ws; obsSet('connecting');
  ws.onmessage=async ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch{ return; }
    if(m.op===0){ // Hello
      const d={rpcVersion:1,eventSubscriptions:0}, a=m.d&&m.d.authentication;
      if(a){ if(!s.password){ obs.needPassword=true; obsSet('error','OBS просит пароль — впиши его ниже'); renderSettings(); ws.close(); return; }
        d.authentication=await sha256b64((await sha256b64(s.password+a.salt))+a.challenge); }
      ws.send(JSON.stringify({op:1,d}));
    }else if(m.op===2){ obs.ready=true; obsSet('ok'); obsRefreshLists(); if(isObsInput()) shotSchedule(0); }
    else if(m.op===7){ const q=obs.pending.get(m.d.requestId); if(!q) return; obs.pending.delete(m.d.requestId); clearTimeout(q.t);
      const st=m.d.requestStatus; st.result?q.res(m.d.responseData||{}):q.rej(new Error(st.comment||`ошибка ${st.code}`)); }
  };
  ws.onclose=ev=>{
    if(obs.ws!==ws) return; obs.ws=null; obs.ready=false;
    for(const q of obs.pending.values()){ clearTimeout(q.t); q.rej(new Error('соединение с OBS потеряно')); } obs.pending.clear();
    if(ev.code===4009){ obs.needPassword=true; obsSet('error','Неверный пароль'); renderSettings(); }
    else if(obs.state!=='error') obsSet('error','Нет соединения — OBS запущен и WebSocket-сервер включён?');

  };
}
function obsReq(requestType,requestData){
  if(!obs.ready||!obs.ws) return Promise.reject(new Error('OBS не подключён (Настройки → OBS WebSocket)'));
  const requestId='r'+(++obs.seq);
  return new Promise((res,rej)=>{ const t=setTimeout(()=>{ obs.pending.delete(requestId); rej(new Error('OBS не ответил')); },5000);
    obs.pending.set(requestId,{res,rej,t}); obs.ws.send(JSON.stringify({op:6,d:{requestType,requestId,requestData}})); });

let aspect=16/9;
function handFeature(lm, handed){
  const flip = handed==='Left' ? -1 : 1;  // зеркалим левую руку, чтобы жест работал обеими
  const w=lm[0], m=lm[9];
  const sc=Math.hypot((m.x-w.x)*aspect, m.y-w.y)||1e-6;
  const f=new Array(42);
  for(let i=0;i<21;i++){ f[2*i]=flip*(lm[i].x-w.x)*aspect/sc; f[2*i+1]=(lm[i].y-w.y)/sc; }
  return {f,sc};
}
function twoHandFeature(h1,h2){
  const [a,b]=h1.lm[0].x<h2.lm[0].x?[h1,h2]:[h2,h1];
  const sc=(a.feat.sc+b.feat.sc)/2;
  return [...a.feat.f, ...b.feat.f, (b.lm[0].x-a.lm[0].x)*aspect/sc, (b.lm[0].y-a.lm[0].y)/sc];
}
function featDist(a,b){
  if(!a||!b||a.length!==b.length) return Infinity;
  let s=0; const n=a.length/2;
  for(let i=0;i<a.length;i+=2) s+=Math.hypot(a[i]-b[i],a[i+1]-b[i+1]);
  return s/n;
}
function nearest(gst, feat){ let best=Infinity; for(const s of gst.samples){ const d=featDist(s,feat); if(d<best) best=d; } return best; }

  let r; try{ r=recognizer.recognizeForVideo(src,ts); }catch(e){ console.warn(e); return false; }
  ingestHands(r,t);
  if((faceLm||poseLm)&&detCount%Math.max(1,cfg.settings.modelEvery|0)===0){   // лицо и тело можно считать реже рук
    if(faceLm){ try{ faceUpdate(faceLm.detectForVideo(src,ts),t); }catch(e){ console.warn(e); } }
    if(poseLm){ try{ poseUpdate(poseLm.detectForVideo(src,ts),t); }catch(e){ console.warn(e); } }
  }
  if(rec) recordStep(t);
  detCount++;
  return true;
}
// Имена рук для раздельного срабатывания: 'L'/'R' по handedness модели; если она назвала обе руки одинаково —
// различаем по положению в кадре. Жест двумя руками — 'LR', лицо — 'F', тело — 'P'.
function handKeys(){
  const keys=hands.map(h=>h.handed==='Left'?'L':'R');
  if(keys.length===2&&keys[0]===keys[1]){ const l=hands[0].lm[0].x<hands[1].lm[0].x?0:1; keys[l]='L'; keys[1-l]='R'; }
  return keys;
}
// Результат модели рук -> hands[] с точками на экране, признаками для своих жестов и непрерывными величинами
function ingestHands(r,t){
  hands=(r.landmarks||[]).map((lm,i)=>{
    const handed=r.handedness?.[i]?.[0]?.categoryName||'Right';
    const gst=r.gestures?.[i]?.[0];
    const h={lm,handed,builtin:gst?{name:gst.categoryName,score:gst.score}:null};
    h.feat=handFeature(lm,handed);
    h.pts=lm.map(toScreen); h.c=palmCenter(h.pts); h.center=h.c; h.tip=h.pts[8];
    const scPx=h.feat.sc*layout.dh||1, d=(a,b)=>Math.hypot(h.pts[a].x-h.pts[b].x,h.pts[a].y-h.pts[b].y)/scPx;
    // pinch — зазор большой–указательный, spread — раскрытие ладони, roll — поворот кисти на экране (0° пальцы вверх, + по часовой)
    h.m={pinch:d(4,8),spread:(d(0,8)+d(0,12)+d(0,16)+d(0,20))/4,roll:Math.atan2(h.pts[9].x-h.pts[0].x,-(h.pts[9].y-h.pts[0].y))*180/Math.PI};
    return h;
  });
  const keys=handKeys(); hands.forEach((h,i)=>h.key=keys[i]);
  updateHandState(t);
}

// ---------- живое состояние рук: позиции, скорость, траектории ----------
const tracks=new Map();   // 'L'/'R'/'F' -> [{t,x,y,g}] в долях экрана за последние ~2 с (g — встроенный жест в тот момент)
function trackPush(k,t,x,y,g){ let a=tracks.get(k); if(!a) tracks.set(k,a=[]); a.push({t,x,y,g}); while(a.length&&t-a[0].t>2000) a.shift(); }
function updateHandState(t){
  const seen=new Set();
  for(const h of hands){ const hk=h.key; seen.add(hk);
    const prev=handLm.get(hk), dt=prev?(t-prev.t)/1000:0;
    const st={pts:h.pts,c:h.c,sc:h.feat.sc*layout.dh||1,t,since:prev?prev.since:t,vx:0,vy:0,m:h.m,gest:h.builtin?.name||'None',score:h.builtin?.score||0};
    if(prev&&dt>0&&dt<0.5){ const k=Math.min(1,dt*12); st.vx=prev.vx*(1-k)+(h.c.x-prev.c.x)/dt*k; st.vy=prev.vy*(1-k)+(h.c.y-prev.c.y)/dt*k; }
    handLm.set(hk,st); trackPush(hk,t,h.c.x/W,h.c.y/H,st.gest);
  }
  for(const [k,v] of handLm) if(!seen.has(k)&&t-v.t>400){ handLm.delete(k); tracks.delete(k); dynRefr.delete(k); }
  if(cfg.settings.dyn.enabled) detectDynamics(t);
}
function faceUpdate(r,t){
  const lm=r.faceLandmarks?.[0];
  if(!lm){ if(t-faceNow.t>600){ faceNow.pts=null; faceNow.bs=null; faceNow.box=null; } return; }
  const pts=lm.map(toScreen); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
  const bs={}; for(const c of r.faceBlendshapes?.[0]?.categories||[]) bs[c.categoryName]=c.score;
  faceNow.t=t; faceNow.pts=pts; faceNow.bs=bs; faceNow.box={x:x0,y:y0,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};
  faceNow.tilt=Math.atan2(pts[263].y-pts[33].y,pts[263].x-pts[33].x)*180/Math.PI;   // наклон головы по линии глаз
  trackPush('F',t,pts[1].x/W,pts[1].y/H);   // нос — для кивка и мотания
}
function poseUpdate(r,t){
  const lm=r.landmarks?.[0];
  if(!lm){ if(t-poseNow.t>600){ poseNow.pts=null; poseNow.raw=null; } return; }
  poseNow.t=t; poseNow.raw=lm; poseNow.pts=lm.map(toScreen);
}
// Рамка лица на экране: от модели лица, иначе от позы (глаза, уши, нос). Нужна для фейспалма.
function faceBox(t){
  if(faceNow.box&&t-faceNow.t<500) return faceNow.box;
  const p=poseNow.pts, r=poseNow.raw; if(!p||t-poseNow.t>500||[0,2,5,7,8].some(i=>(r[i].visibility??1)<0.5)) return null;
  const w=Math.max(20,Math.abs(p[7].x-p[8].x)*1.15), cx=(p[2].x+p[5].x+p[0].x)/3, cy=p[0].y;
  return {x:cx-w/2,y:cy-w*0.7,w,h:w*1.4,cx,cy};
}

// ---------- динамика: свайпы, круги, бросок, кивок — события, а не позы ----------
const dynEvents=[];        // {id,hand,anchor,tip,dir?,until}: событие живёт 300 мс как «активный жест»
const dynRefr=new Map();   // рука -> время, до которого новые движения не ловим (чтобы одно движение не дало два события)
let lastEvent=null;
function emitEvent(id,hand,anchor,tip,extra,t){ dynEvents.push({id,hand,anchor,tip,dir:extra.dir,until:t+300}); dynRefr.set(hand,t+(extra.refr||700)); lastEvent={id,hand,t}; }
const spanLen=(a,b)=>Math.hypot(b.x-a.x,(b.y-a.y)*H/W);   // расстояние между точками трека в долях ширины экрана
function detectDynamics(t){
  const D=cfg.settings.dyn;
  for(const h of hands){ const hk=h.key, tr=tracks.get(hk); if(!tr||tr.length<4||(dynRefr.get(hk)||0)>t) continue;
    const st=handLm.get(hk), cur=tr[tr.length-1];
    // свайп: за swipeTime мс сместилась на swipeDist ширины экрана почти по прямой, вдоль одной оси
    const w=tr.filter(p=>t-p.t<=D.swipeTime);
    if(w.length>=3&&t-tr[0].t>=300){ const p0=w[0], d={x:cur.x-p0.x,y:(cur.y-p0.y)*H/W}, L=Math.hypot(d.x,d.y); let path=0;
      for(let i=1;i<w.length;i++) path+=spanLen(w[i-1],w[i]);
      let straight=L>=D.swipeDist&&L/path>=0.75;   // и все отрезки смотрят примерно в одну сторону (±35°): дуга круга — не свайп
      for(let i=1;i<w.length&&straight;i++){ const sx=w[i].x-w[i-1].x, sy=(w[i].y-w[i-1].y)*H/W, sl=Math.hypot(sx,sy); if(sl>0.01&&(sx*d.x+sy*d.y)/(sl*L)<0.82) straight=false; }
      if(straight){ const ax=Math.abs(d.x), ay=Math.abs(d.y); let id=null;
        if(ax>1.7*ay) id=d.x>0?'Swipe_Right':'Swipe_Left'; else if(ay>1.7*ax) id=d.y>0?'Swipe_Down':'Swipe_Up';
        if(id){ emitEvent(id,hk,st.c,st.pts[8],{dir:d},t); tr.length=0; continue; } } }
    // бросок: недавно был кулак, сейчас ладонь раскрыта, и за это время рука разогналась
    if(st.gest==='Open_Palm'){ let vmax=0, from=null;
      for(let i=tr.length-1;i>0&&t-tr[i].t<=500;i--){ const dt=(tr[i].t-tr[i-1].t)/1000||1e-3; vmax=Math.max(vmax,spanLen(tr[i-1],tr[i])/dt); if(tr[i-1].g==='Closed_Fist') from=tr[i-1]; }
      if(from&&vmax>=D.throwSpeed){ emitEvent('Throw',hk,st.c,st.pts[8],{dir:{x:cur.x-from.x,y:(cur.y-from.y)*H/W},refr:900},t); tr.length=0; continue; } }
    // круг: за circleTime мс точки лежат на окружности, угол набежал почти на оборот в одну сторону
    const c=tr.filter(p=>t-p.t<=D.circleTime);
    if(c.length>=8){ let cx=0,cy=0; for(const p of c){ cx+=p.x; cy+=p.y*H/W; } cx/=c.length; cy/=c.length;
      const rs=c.map(p=>Math.hypot(p.x-cx,p.y*H/W-cy)), R=rs.reduce((a,b)=>a+b)/rs.length;
      if(R>=0.04&&Math.sqrt(rs.reduce((a,r)=>a+(r-R)**2,0)/rs.length)/R<=0.35){ let sum=0,pos=0,neg=0;
        for(let i=1;i<c.length;i++){ let d=Math.atan2(c[i].y*H/W-cy,c[i].x-cx)-Math.atan2(c[i-1].y*H/W-cy,c[i-1].x-cx);
          if(d>Math.PI) d-=2*Math.PI; if(d<-Math.PI) d+=2*Math.PI; sum+=d; d>0?pos++:neg++; }
        if(Math.abs(sum)>=1.8*Math.PI&&Math.max(pos,neg)/(c.length-1)>=0.8){ emitEvent(sum>0?'Circle_CW':'Circle_CCW',hk,st.c,st.pts[8],{refr:1000},t); tr.length=0; continue; } } }
  }
  // кивок / мотание — нос колеблется по вертикали / горизонтали: не меньше трёх смен направления за 1,2 с
  const f=tracks.get('F'), fb=faceNow.box;
  if(f&&f.length>=6&&fb&&(dynRefr.get('F')||0)<=t){
    const osc=(axis,amp)=>{ const w=f.filter(p=>t-p.t<=1200); if(w.length<6) return false; let rev=0,dir=0,last=w[0][axis];
      for(const p of w){ const d=p[axis]-last; if(Math.abs(d)<amp) continue; const sg=Math.sign(d); if(dir&&sg!==dir) rev++; dir=sg; last=p[axis]; } return rev>=3; };
    const a={x:fb.cx,y:fb.cy}, tp={x:fb.cx,y:fb.y};
    if(osc('y',fb.h/H*0.1)){ emitEvent('Face_Nod','F',a,tp,{refr:1200},t); f.length=0; }
    else if(osc('x',fb.w/W*0.1)){ emitEvent('Face_Shake','F',a,tp,{refr:1200},t); f.length=0; }
  }
}

function isFingerHeart(lm){
  const d=(a,b)=>Math.hypot((lm[a].x-lm[b].x)*aspect,lm[a].y-lm[b].y), palm=d(0,9);
  if(palm<0.015) return false;
  const folded=(tip,joint)=>d(0,tip)<d(0,joint)*1.12;
  return d(4,8)<palm*0.38 && d(0,4)>palm*0.65 && d(0,8)>palm*0.85 && folded(12,10) && folded(16,14) && folded(20,18);
}

// ---------- k-NN по своим жестам ----------
// Среди всех записанных кадров своих жестов на nh рук (включая «фон» — то, что жестом НЕ является) берём K ближайших;
// побеждает жест с наибольшим взвешенным голосом, и срабатывает только если его ближайший кадр ближе порога.
// С выключенным k-NN — старое поведение: каждый жест сравнивается со своим порогом независимо.
function knnHits(feat,nh){
  const K=5, gs=cfg.customGestures.filter(c=>c.kind!=='combo'&&c.hands===nh&&c.samples.length); if(!gs.length) return [];
  const seen=(cg,d)=>liveDist.set(cg.id,Math.min(d,liveDist.get(cg.id)??Infinity));
  if(!cfg.settings.knn){ const out=[]; for(const cg of gs){ const d=nearest(cg,feat); seen(cg,d); if(!cg.negative&&d<cg.threshold) out.push({id:cg.id,d}); } return out; }
  const cands=[]; for(const cg of gs){ let bd=Infinity; for(const smp of cg.samples){ const d=featDist(smp,feat); if(d<bd) bd=d; cands.push([d,cg]); } seen(cg,bd); }
  cands.sort((a,b)=>a[0]-b[0]);
  const votes=new Map(); for(const [d,cg] of cands.slice(0,K)) votes.set(cg,(votes.get(cg)||0)+1/(d+0.02));
  let win=null; for(const [cg,v] of votes) if(!win||v>win.v) win={cg,v};
  const bd=cands.find(c=>c[1]===win.cg)[0];
  return !win.cg.negative&&bd<win.cg.threshold?[{id:win.cg.id,d:bd}]:[];
}

// ---------- что активно сейчас ----------
const stable=new Map();     // 'жест@рука' -> {n,last}: сколько детекций подряд поза видна (settings.stableFrames)
const gestSince=new Map();  // 'жест@рука' -> {since,last}: с какого момента жест держится (для ручки «время удержания»)
const actLog=new Map();     // рука -> [{id,t,anchor,tip}]: недавние появления жестов, для комбо
const comboFired=new Map(); // 'комбо@рука' -> t появления, на котором комбо уже сработало
let prevKeys=new Set();
function computeActive(t){
  const act=new Map(); const s=cfg.settings;   // gestureId -> [{hand,anchor,tip,score,dir?,event?}], по экземпляру на каждую руку
  const put=(id,hand,anchor,tip,score,extra)=>{ let arr=act.get(id); if(!arr) act.set(id,arr=[]);
    const cur=arr.find(x=>x.hand===hand); if(!cur) arr.push({hand,anchor,tip,score,...extra}); else if(score>cur.score) Object.assign(cur,{anchor,tip,score},extra); };
  liveDist.clear();
  const fb=faceBox(t);
  hands.forEach(h=>{
    const hk=h.key; let customHit=false;
    for(const hit of knnHits(h.feat.f,1)){ put('c:'+hit.id,hk,h.c,h.tip,1-hit.d); customHit=true; }
    const skipBuiltin=s.customPriority&&customHit;
    if(!skipBuiltin&&isFingerHeart(h.lm)){ const a=h.pts[4], b=h.pts[8]; put('Finger_Heart',hk,{x:(a.x+b.x)/2,y:(a.y+b.y)/2},h.tip,1); }
    else if(!skipBuiltin&&h.builtin&&h.builtin.name!=='None'&&h.builtin.score>=s.minScore) put(h.builtin.name,hk,h.c,h.tip,h.builtin.score);
    if(fb&&Math.abs(h.c.x-fb.cx)<fb.w*0.6&&Math.abs(h.c.y-fb.cy)<fb.h*0.6) put('Facepalm',hk,h.c,h.tip,1);   // ладонь закрыла лицо
  });
  if(hands.length>=2){
    const [a,b]=hands; const mid={x:(a.c.x+b.c.x)/2,y:(a.c.y+b.c.y)/2}, tipMid={x:(a.tip.x+b.tip.x)/2,y:(a.tip.y+b.tip.y)/2};
    // встроенное правило: сердце двумя руками
    const sc=(a.feat.sc+b.feat.sc)/2, dist=(p,q)=>Math.hypot((p.x-q.x)*aspect,p.y-q.y);
    if(dist(a.lm[8],b.lm[8])<0.75*sc && dist(a.lm[4],b.lm[4])<0.75*sc && a.lm[8].y<a.lm[4].y && b.lm[8].y<b.lm[4].y &&
       dist(a.lm[8],a.lm[4])>0.5*sc) put('Two_Hand_Heart','LR',{x:(a.pts[8].x+b.pts[4].x)/2,y:a.pts[6].y},tipMid,1);
    for(const hit of knnHits(twoHandFeature(a,b),2)) put('c:'+hit.id,'LR',mid,tipMid,1-hit.d);
  }
  // лицо: blendshapes модели лица, порог — «чувствительность лица» в настройках
  const bs=faceNow.bs;
  if(bs&&t-faceNow.t<500){ const B=faceNow.box, fa={x:B.cx,y:B.cy}, ft={x:B.cx,y:B.y}, thr=1.1-s.faceSens, v=k=>bs[k]||0;
    const F=(id,sc)=>{ if(sc>=thr) put(id,'F',fa,ft,sc); };
    F('Face_MouthOpen',v('jawOpen')); F('Face_Smile',(v('mouthSmileLeft')+v('mouthSmileRight'))/2);
    F('Face_BrowsUp',Math.max(v('browInnerUp'),(v('browOuterUpLeft')+v('browOuterUpRight'))/2)); F('Face_Frown',(v('browDownLeft')+v('browDownRight'))/2);
    F('Face_Puff',v('cheekPuff')); if(v('mouthPucker')>=thr&&v('jawOpen')<0.25) put('Face_Kiss','F',fa,ft,v('mouthPucker'));
    const bl=v('eyeBlinkLeft'), br=v('eyeBlinkRight'); if((bl>=0.6&&br<=0.3)||(br>=0.6&&bl<=0.3)) put('Face_Wink','F',fa,ft,Math.max(bl,br));
  }
  // тело: позы по 33 точкам (11/12 плечи, 15/16 кисти, 23/24 бёдра, 7/8 уши; «левое» — левое у человека, в кадре справа)
  const pp=poseNow.raw;
  if(pp&&t-poseNow.t<500){ const P=poseNow.pts, vis=i=>(pp[i].visibility??1)>0.5;
    if([0,7,8,11,12,15,16].every(vis)){ const sw=Math.hypot((pp[11].x-pp[12].x)*aspect,pp[11].y-pp[12].y)||1e-6, swx=sw/aspect, ps=s.poseSens;
      const chest={x:(P[11].x+P[12].x)/2,y:(P[11].y+P[12].y)/2}, top={x:chest.x,y:P[0].y};
      const earY=(pp[7].y+pp[8].y)/2, shY=(pp[11].y+pp[12].y)/2, lw=pp[15], rw=pp[16], midX=(pp[11].x+pp[12].x)/2;
      const hipY=vis(23)&&vis(24)?(pp[23].y+pp[24].y)/2:shY+sw*1.6;
      if((shY-earY)/sw<0.25+0.4*ps) put('Pose_Shrug','P',top,top,1);                                   // плечи подтянулись к ушам
      if(lw.x<midX-swx*0.1&&rw.x>midX+swx*0.1&&lw.y>shY&&lw.y<hipY&&rw.y>shY&&rw.y<hipY) put('Pose_ArmsCrossed','P',chest,chest,1);   // кисти накрест на груди
      if(lw.y<pp[0].y&&rw.y<pp[0].y) put('Pose_HandsUp','P',top,top,1);
      if(Math.abs(lw.y-pp[11].y)<sw*0.35&&Math.abs(rw.y-pp[12].y)<sw*0.35&&Math.abs(lw.x-pp[11].x)>swx*0.9&&Math.abs(rw.x-pp[12].x)>swx*0.9) put('Pose_TPose','P',chest,chest,1);
    } }
  // стабильность: поза должна быть видна stableFrames детекций подряд (события добавляются ниже и идут сразу)
  const need=Math.max(1,s.stableFrames|0), cur=new Set();
  for(const [id,arr] of act){ for(let i=arr.length-1;i>=0;i--){ const k=id+'@'+arr[i].hand; cur.add(k);
      let st=stable.get(k); if(!st) stable.set(k,st={n:0}); st.n++; st.last=t; if(st.n<need) arr.splice(i,1); }
    if(!arr.length) act.delete(id); }
  for(const [k,st] of stable) if(!cur.has(k)){ if(t-st.last>220) stable.delete(k); else st.n=0; }
  // события динамики и комбо
  for(let i=dynEvents.length-1;i>=0;i--){ const e=dynEvents[i]; if(e.until<t){ dynEvents.splice(i,1); continue; } put(e.id,e.hand,e.anchor,e.tip,1,{dir:e.dir,event:true}); }
  const comboIds=new Set(cfg.customGestures.filter(c=>c.kind==='combo').map(c=>'c:'+c.id)), nowKeys=new Set();
  for(const [id,arr] of act) for(const a of arr){ const k=id+'@'+a.hand; nowKeys.add(k);
    let gs=gestSince.get(k); if(!gs) gestSince.set(k,gs={since:t}); gs.last=t;
    if(!prevKeys.has(k)&&!comboIds.has(id)){ let log=actLog.get(a.hand); if(!log) actLog.set(a.hand,log=[]);
      log.push({id,t,anchor:a.anchor,tip:a.tip}); while(log.length>12||(log.length&&t-log[0].t>6000)) log.shift(); } }
  for(const [k,gs] of gestSince) if(!nowKeys.has(k)&&t-gs.last>220) gestSince.delete(k);
  prevKeys=nowKeys;
  // комбо — цепочка жестов подряд на одной руке (или на лице): проверяем на свежем появлении последнего шага
  for(const cg of cfg.customGestures){ if(cg.kind!=='combo'||!cg.steps?.length) continue;
    for(const [hand,log] of actLog){ const last=log[log.length-1]; if(!last||last.t!==t||last.id!==cg.steps[cg.steps.length-1]) continue;
      let ok=true, tk=last.t, j=log.length-2;
      for(let k=cg.steps.length-2;k>=0;k--){ while(j>=0&&log[j].id!==cg.steps[k]&&tk-log[j].t<=cg.gap) j--;
        if(j<0||log[j].id!==cg.steps[k]||tk-log[j].t>cg.gap){ ok=false; break; } tk=log[j].t; j--; }
      const fk=cg.id+'@'+hand; if(!ok||comboFired.get(fk)===last.t) continue; comboFired.set(fk,last.t);
      dynEvents.push({id:'c:'+cg.id,hand,anchor:last.anchor,tip:last.tip,until:t+300}); lastEvent={id:'c:'+cg.id,hand,t};
      put('c:'+cg.id,hand,last.anchor,last.tip,1,{event:true}); } }
  return act;
}

// ====================== Правила: удержание и кулдаун ======================
const ruleState=new Map();   // rule.id -> Map(рука -> {since,lost,fired,last})
let activeNow=new Map();     // gestureId -> [{hand,anchor,tip,score,dir?}]
const fireLog=[];            // последние срабатывания (HUD, отладка, тесты)
// Правило срабатывает с каждой руки отдельно, если эффект привязан к руке и в правиле это не выключено.
// Экранные эффекты, действия OBS и эффекты на две руки срабатывают один раз, от руки с лучшим счётом.
const perHand = rule => rule.perHand!==false && !!EFFECTS[rule.effect]?.anchored && !EFFECTS[rule.effect]?.twoHands;
const bestOf = arr => arr.reduce((b,a)=>a.score>b.score?a:b);
function fireRule(rule, anchor, src){
  const e=EFFECTS[rule.effect]; if(!e) return;
  const p=ruleParams(rule);
  if(knobState.intensity!==1) for(const k of ['count','bolts']) if(typeof p[k]==='number') p[k]=Math.max(1,Math.round(p[k]*knobState.intensity));   // ручка «интенсивность»
  try{ e.run(p, anchor||{x:W/2,y:H/2}, src||rule.gesture); }catch(err){ console.error(err); }
  playSound(rule.sound);
  fireLog.push({effect:rule.effect,gesture:rule.gesture,src,t:now()}); if(fireLog.length>100) fireLog.shift();
}
function processRules(t){
  activeNow=computeActive(t);
  for(const [id,arr] of activeNow){ for(const a of arr){ tips.set(id+'@'+a.hand,a.tip); anchors.set(id+'@'+a.hand,a.anchor); }
    const b=bestOf(arr); tips.set(id,b.tip); anchors.set(id,b.anchor); }
  for(const rule of cfg.rules){
    if(!rule.enabled) continue;
    let states=ruleState.get(rule.id); if(!states){ states=new Map(); ruleState.set(rule.id,states); }
    const arr=activeNow.get(rule.gesture)||[], hold=isEventGesture(rule.gesture)?0:rule.hold;   // событие (свайп, комбо) — без удержания
    const inst=!arr.length?[] : perHand(rule)?arr.map(a=>[a.hand,a,rule.gesture+'@'+a.hand]) : [['*',bestOf(arr),rule.gesture]];
    const seen=new Set();
    for(const [hk,a,src] of inst){
      seen.add(hk);
      let st=states.get(hk); if(!st){ st={since:null,lost:null,fired:false,last:-1e9}; states.set(hk,st); }
      st.lost=null; if(st.since==null) st.since=t;
      if(t-st.since>=hold && t-st.last>=rule.cooldown && (rule.repeat||!st.fired)){ fireRule(rule,{...a.anchor,dir:a.dir},src); st.last=t; st.fired=true; }
    }
    for(const [hk,st] of states){
      if(seen.has(hk)||st.since==null) continue;
      if(st.lost==null) st.lost=t;
      if(t-st.lost>220){ st.since=null; st.lost=null; st.fired=false; }  // небольшая «терпимость» к морганию детекции
    }
  }
  processKnobs(t);
}

// ====================== Запись своих жестов ======================
// Два способа: «● Записать» — 2,5 с кадров подряд, «📸 Кадр» (клавиша C) — один кадр за нажатие: показал десять раз — десять кадров.
// negative — «фон»: позы, которые жестом НЕ являются; участвуют в k-NN-голосовании и глушат ложные срабатывания, но сами не срабатывают.
let snapTarget=null;                    // цель для клавиши C: {name,hands,gestureId?,negative?} — форма или карточка, что нажали последним
let formTarget={name:'Мой жест',hands:1};   // цель формы «Записать новый жест»; gestureId появляется после первого кадра и живёт, пока не сменили название
function startRecording(target){ // target: {gestureId?|name,hands,negative?}
  if(!recognizer||!(isObsInput()?shot.img:stream)){ toast('Нет кадров или модель ещё не готова'); return; }
  const t=now(); rec={...target,start:t+3000,end:t+5500,samples:[]};
}
function recordStep(t){
  if(t<rec.start) return;
  // на медленных машинах кадров мало — продлеваем запись, пока не наберём хотя бы 15 (максимум +4 с)
  if(t>rec.end && (rec.samples.length>=15 || t>rec.end+4000)){ finishRecording(); return; }
  if(rec.hands===1 && hands.length>=1) rec.samples.push(hands[0].feat.f.slice());
  else if(rec.hands===2 && hands.length>=2){ rec.samples.push(twoHandFeature(hands[0],hands[1])); }
}
function addSamples(target,s){   // кладёт кадры в существующий жест или создаёт новый; возвращает жест
  s=s.map(v=>v.map(x=>Math.round(x*1000)/1000));
  let cg=target.gestureId?cfg.customGestures.find(x=>x.id===target.gestureId):null;
  if(!cg&&target.negative) cg=cfg.customGestures.find(x=>x.negative&&x.hands===target.hands);
  if(!cg){ cg={id:uid(),name:target.name||(target.negative?'Фон (не жест)':'Мой жест'),hands:target.hands,threshold:target.hands===2?0.35:0.25,samples:[],negative:!!target.negative}; cfg.customGestures.push(cg); }
  cg.samples.push(...s); if(cg.samples.length>160) cg.samples=cg.samples.slice(-160);
  target.gestureId=cg.id; save(); renderCustom(); renderRules(); renderKnobs(); return cg;
}
function finishRecording(){
  const r=rec; rec=null;
  let s=r.samples; if(s.length<3){ toast(r.hands===2?'Не увидел две руки — попробуй ещё раз':'Не увидел руку — попробуй ещё раз'); return; }
  if(s.length>40){ const step=s.length/40; s=Array.from({length:40},(_,i)=>s[Math.floor(i*step)]); }
  const cg=addSamples(r,s); toast(`«${cg.name}»: записано кадров — ${s.length}`);
}
function snapshotSample(target){
  let f=null;
  if(target.hands===1&&hands.length>=1) f=hands[0].feat.f.slice(); else if(target.hands===2&&hands.length>=2) f=twoHandFeature(hands[0],hands[1]);
  if(!f){ toast(target.hands===2?'Не вижу две руки':'Не вижу руку'); return; }
  const cg=addSamples(target,[f]); toast(`«${cg.name}»: кадров ${cg.samples.length}`);
}

// ====================== Ручки: непрерывные параметры ======================
// Ручка — не триггер, а регулятор: пока выполняется условие (жест или просто рука/лицо в кадре), значение источника
// (щепотка, высота руки, поворот кисти, открытость рта…) линейно переводится из диапазона входа в диапазон цели.
const KNOB_SRC={
  pinch:  {name:'Щепотка: зазор большой–указательный', min:0.15, max:1.3, fmt:v=>v.toFixed(2)+' ладони'},

  roll:   {name:'Поворот кисти',                       min:-90,  max:90,  fmt:v=>v.toFixed(0)+'°'},
  y:      {name:'Высота руки',                         min:0.15, max:0.85,fmt:v=>(v*100).toFixed(0)+'% экрана'},
  x:      {name:'Рука по горизонтали',                 min:0.15, max:0.85,fmt:v=>(v*100).toFixed(0)+'% экрана'},
  size:   {name:'Близость к камере (размер ладони)',   min:0.08, max:0.4, fmt:v=>(v*100).toFixed(0)+'% высоты'},
  hold:   {name:'Время удержания жеста',               min:0,    max:3,   fmt:v=>v.toFixed(1)+' с'},
  twoDist:{name:'Расстояние между руками',             min:0.1,  max:0.8, fmt:v=>(v*100).toFixed(0)+'% ширины', two:true},
  mouth:  {name:'Открытость рта',                      min:0.05, max:0.7, fmt:v=>v.toFixed(2), face:true},
  brows:  {name:'Поднятые брови',                      min:0.1,  max:0.8, fmt:v=>v.toFixed(2), face:true},
  tilt:   {name:'Наклон головы',                       min:-30,  max:30,  fmt:v=>v.toFixed(0)+'°', face:true},
  headX:  {name:'Голова по горизонтали',               min:0.25, max:0.75,fmt:v=>(v*100).toFixed(0)+'% экрана', face:true},
};
const KNOB_TGT={
  zoomLocal:   {name:'Зум картинки в этом оверлее (режим камеры)', min:1, max:2.2, reset:1,
    params:{at:{label:'Центр зума',type:'select',options:{hand:'рука',center:'центр экрана'},def:'hand'}}},
  obsTransform:{name:'OBS: трансформация источника', obs:true, eps:0.004, min:1, max:2.2, reset:1,
    params:{source:{label:'Источник',type:'text',def:'',list:'dl-obs-sources'},scene:{label:'Сцена (пусто — текущая)',type:'text',def:'',list:'dl-obs-scenes'},
      prop:{label:'Что менять',type:'select',options:{scale:'масштаб (×, вокруг центра)',rotation:'поворот, ° (+ к текущему)',x:'сдвиг по X, px',y:'сдвиг по Y, px'},def:'scale'}}},
  obsVolume:   {name:'OBS: громкость источника звука', obs:true, eps:0.01, min:0, max:1, reset:1,
    params:{input:{label:'Источник звука',type:'text',def:'',list:'dl-obs-inputs'}}},
  obsFilter:   {name:'OBS: параметр фильтра', obs:true, eps:0.5, min:0, max:100, reset:0,
    params:{source:{label:'Источник',type:'text',def:'',list:'dl-obs-sources'},filter:{label:'Фильтр',type:'text',def:''},
      key:{label:'Ключ настройки',type:'text',def:''}}},
  volume:      {name:'Громкость эффектов оверлея (×)', min:0, max:1, reset:1},
  intensity:   {name:'Интенсивность эффектов (× к количеству частиц)', min:0.2, max:3, reset:1},
  hue:         {name:'Оттенок эффектов (поворот цвета, °)', min:0, max:360, reset:0},
};
const KNOB_PRESETS=[
  {label:'Щепотка → зум камеры в OBS', k:{name:'Щепотка → зум',source:'pinch',gate:'*',target:'obsTransform',params:{prop:'scale'},outMin:1,outMax:2,resetTo:1,release:'reset'}},
  {label:'Высота ✋ → громкость OBS', k:{name:'Высота руки → громкость',source:'y',gate:'Open_Palm',target:'obsVolume',outMin:0,outMax:1,resetTo:1,release:'keep'}},
  {label:'Поворот ✋ → оттенок эффектов', k:{name:'Поворот кисти → оттенок',source:'roll',gate:'Open_Palm',target:'hue',outMin:0,outMax:360,resetTo:0,release:'keep'}},
  {label:'Удержание ✊ → интенсивность', k:{name:'Держу кулак → интенсивность',source:'hold',gate:'Closed_Fist',target:'intensity',inMin:0,inMax:3,outMin:0.5,outMax:3,resetTo:1,release:'reset'}},
  {label:'Открытый рот → зум оверлея', k:{name:'Рот → зум',source:'mouth',gate:'*',target:'zoomLocal',outMin:1,outMax:1.8,resetTo:1,release:'reset'}},
];
function newKnob(o={}){ const src=KNOB_SRC[o.source||'pinch'], tgt=KNOB_TGT[o.target||'zoomLocal'];
  return {id:uid(),enabled:true,name:'',hand:'any',gate:'*',source:'pinch',inMin:src.min,inMax:src.max,invert:false,target:'zoomLocal',params:{},
    outMin:tgt.min,outMax:tgt.max,resetTo:tgt.reset,release:'reset',smooth:0.4,...o}; }
const knobState={intensity:1,volume:1,hue:0,st:new Map()};   // st: knob.id -> {raw,v,out,active,hand,base,lastSend,lastOut,errT}
// сырое значение источника или null, если условие ручки не выполнено (нет руки/лица, нет жеста-условия)
function knobRaw(k,st,t){
  const S=KNOB_SRC[k.source]; if(!S) return null;
  const gated=hk=>{ if(k.gate==='*') return true; const arr=activeNow.get(k.gate); return !!arr&&(!hk||arr.some(a=>a.hand===hk||a.hand==='LR')); };
  if(S.face){ if(!faceNow.bs||t-faceNow.t>500||!gated()) return null; const bs=faceNow.bs;
    return k.source==='mouth'?bs.jawOpen||0 : k.source==='brows'?Math.max(bs.browInnerUp||0,((bs.browOuterUpLeft||0)+(bs.browOuterUpRight||0))/2)
         : k.source==='tilt'?faceNow.tilt : faceNow.box.cx/W; }
  if(S.two){ const L=handLm.get('L'),R=handLm.get('R'); if(!L||!R||t-L.t>400||t-R.t>400||!gated()) return null; return Math.hypot(L.c.x-R.c.x,L.c.y-R.c.y)/W; }
  let best=null, bk=null;
  for(const [hk,h] of handLm){ if(t-h.t>400||(k.hand!=='any'&&k.hand!==hk)||!gated(hk)) continue; if(!best||h.t>best.t){ best=h; bk=hk; } }
  if(!best) return null; st.hand=bk; st.pos=best.c;
  switch(k.source){ case 'pinch': return best.m.pinch; case 'spread': return best.m.spread; case 'roll': return best.m.roll;
    case 'y': return 1-best.c.y/H; case 'x': return best.c.x/W; case 'size': return best.sc/H;
    case 'hold': { const t0=k.gate==='*'?best.since:gestSince.get(k.gate+'@'+bk)?.since; return t0==null?0:(t-t0)/1000; } }
  return null;
}
function processKnobs(t){
  let hue=null, vol=null, inten=null, zoom=null;
  for(const k of cfg.knobs){ let st=knobState.st.get(k.id); if(!st) knobState.st.set(k.id,st={v:null,out:null,active:false,lastSend:0});
    if(!k.enabled){ if(st.active){ st.active=false; st.out=null; } continue; }
    const raw=knobRaw(k,st,t); st.raw=raw;
    if(raw==null){ if(st.active){ st.active=false; st.v=null; if(k.release==='reset'){ st.out=k.resetTo; knobApply(k,st,t,true); } } }
    else { let v=clamp((raw-k.inMin)/((k.inMax-k.inMin)||1e-6),0,1); if(k.invert) v=1-v;
      const a=1-clamp(k.smooth??0.4,0,0.95); st.v=st.v==null?v:st.v+(v-st.v)*a; st.out=k.outMin+st.v*(k.outMax-k.outMin);
      if(!st.active){ st.active=true; knobStart(k,st); } knobApply(k,st,t,false); }
    if(st.out!=null){ if(k.target==='hue') hue=st.out; else if(k.target==='volume') vol=st.out; else if(k.target==='intensity') inten=st.out;
      else if(k.target==='zoomLocal') zoom={s:st.out,at:(k.params?.at||'hand')==='hand'&&st.pos?st.pos:{x:W/2,y:H/2}}; }
  }
  knobState.hue=hue??0; knobState.volume=vol??1; knobState.intensity=inten??1;
  const f=knobState.hue?`hue-rotate(${knobState.hue.toFixed(0)}deg)`:''; if(cv.style.filter!==f){ cv.style.filter=f; mediaLayer.style.filter=f; }
  cam.knobZoom=zoom&&zoom.s>1.001?{s:zoom.s,x:zoom.at.x,y:zoom.at.y}:null;
}
function knobStart(k,st){   // для трансформации в OBS запоминаем исходное положение источника — от него считаем масштаб/сдвиг
  if(k.target!=='obsTransform') return; const p=k.params||{}; st.base=null;
  obsAction(async()=>{ if(!p.source) throw new Error('в ручке не указан источник'); const sceneName=p.scene||await obsCurrentScene();
    const {sceneItemId}=await obsReq('GetSceneItemId',{sceneName,sourceName:p.source});
    const {sceneItemTransform}=await obsReq('GetSceneItemTransform',{sceneName,sceneItemId}); st.base={sceneName,sceneItemId,tr:sceneItemTransform};
    if(st.active&&st.out!=null) knobApply(k,st,now(),true); });   // исходное положение пришло — сразу применяем текущее значение
}
function knobApply(k,st,t,force){
  const T=KNOB_TGT[k.target]; if(!T||!T.obs) return;   // локальные цели применяются в processKnobs
  if(t-(st.errT||-1e9)<3000) return;                   // после ошибки OBS не спамим
  if(k.target==='obsTransform'&&!st.base) return;      // ещё не знаем исходное положение — применим, когда придёт (см. knobStart)
  if(!force&&(t-st.lastSend<70||Math.abs((st.lastOut??-1e9)-st.out)<T.eps)) return; st.lastSend=t; st.lastOut=st.out;
  const p=k.params||{}, v=st.out;
  (async()=>{
    if(k.target==='obsVolume'){ if(!p.input) throw new Error('в ручке не указан источник звука'); await obsReq('SetInputVolume',{inputName:p.input,inputVolumeMul:clamp(v,0,20)}); }
    else if(k.target==='obsFilter'){ if(!p.source||!p.filter||!p.key) throw new Error('в ручке укажи источник, фильтр и ключ настройки');
      await obsReq('SetSourceFilterSettings',{sourceName:p.source,filterName:p.filter,filterSettings:{[p.key]:v},overlay:true}); }
    else if(k.target==='obsTransform'){ const b=st.base; if(!b) return; const tr=b.tr, out={};
      if(p.prop==='rotation') out.rotation=(tr.rotation||0)+v;
      else if(p.prop==='x') out.positionX=tr.positionX+v; else if(p.prop==='y') out.positionY=tr.positionY+v;
      else { // масштаб вокруг видимого центра: alignment — биты 1 лево, 2 право, 4 верх, 8 низ (5 = левый верх, 0 = центр)
        const al=tr.alignment??5, ax=(al&1)?0:(al&2)?1:0.5, ay=(al&4)?0:(al&8)?1:0.5;
        if(tr.boundsType&&tr.boundsType!=='OBS_BOUNDS_NONE'){ const w0=tr.boundsWidth,h0=tr.boundsHeight; out.boundsWidth=w0*v; out.boundsHeight=h0*v;
          out.positionX=tr.positionX+(0.5-ax)*(w0-w0*v); out.positionY=tr.positionY+(0.5-ay)*(h0-h0*v); }
        else { const w0=tr.sourceWidth*tr.scaleX,h0=tr.sourceHeight*tr.scaleY; out.scaleX=tr.scaleX*v; out.scaleY=tr.scaleY*v;
          out.positionX=tr.positionX+(0.5-ax)*(w0-w0*v); out.positionY=tr.positionY+(0.5-ay)*(h0-h0*v); } }
      await obsReq('SetSceneItemTransform',{sceneName:b.sceneName,sceneItemId:b.sceneItemId,sceneItemTransform:out}); }
  })().catch(e=>{ st.errT=now(); obsFail(e); });
}

// ====================== Физика: эмоуты летают, рукой их можно сбить или поймать ======================
// Тела — эмодзи или картинки (эмоуты Twitch). Ладонь — круглый коллайдер со скоростью: открытой рукой отбиваешь,
// кулаком или щепоткой ловишь (+1). Источники: Twitch-чат, эффект «Выпустить эмоуты», кнопка в настройках.
const phys={bodies:[],caught:0,imgs:new Map()};
function physImg(url){ let i=phys.imgs.get(url); if(!i){ i=new Image(); i.crossOrigin='anonymous'; i.src=url; phys.imgs.set(url,i); } return i; }
function physSpawn(o){
  const S=cfg.settings.phys; if(!S.enabled) return null;
  if(phys.bodies.length>=S.max) phys.bodies.shift();
  const size=o.size||S.size, r=size*0.45;
  const b={ch:o.ch||null,img:o.url?physImg(o.url):null,size,r,x:o.x??rnd(r,W-r),y:o.y??(S.gravity>0?-r:rnd(r,H-r)),
    vx:o.vx??rnd(-250,250),vy:o.vy??(S.gravity>0?rnd(50,200):rnd(-250,250)),rot:rnd(-0.4,0.4),vr:rnd(-1.5,1.5),age:0,life:o.life||S.life,hit:0};
  phys.bodies.push(b); return b;
}
function physStep(dt,t){
  const S=cfg.settings.phys; if(!phys.bodies.length) return;
  const G=S.gravity*1200, hs=[...handLm].filter(([,h])=>t-h.t<400);
  for(let i=phys.bodies.length-1;i>=0;i--){ const b=phys.bodies[i]; b.age+=dt;
    if(b.age>b.life||b.dead){ phys.bodies.splice(i,1); continue; }
    b.vy+=G*dt; const k=Math.exp(-(S.gravity>0?0.15:0.35)*dt); b.vx*=k; b.vy*=k; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vr*dt;
    if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*S.bounce; } else if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*S.bounce; }
    if(b.y>H-b.r){ b.y=H-b.r; b.vy=-Math.abs(b.vy)*S.bounce; b.vr*=0.9; if(S.gravity>0&&Math.abs(b.vy)<40) b.vy=0; }
    else if(b.y<b.r&&(S.gravity<=0||b.vy<0)){ b.y=b.r; b.vy=Math.abs(b.vy)*S.bounce; }
    for(const [hk,h] of hs){ const R=h.sc*0.75, dx=b.x-h.c.x, dy=b.y-h.c.y, d=Math.hypot(dx,dy); if(d>=R+b.r) continue;
      const fist=S.catchFist&&(activeNow.get('Closed_Fist')||[]).some(a=>a.hand===hk), pinch=h.m.pinch<0.35;
      if((fist||pinch)&&b.age>0.3){ // поймал
        b.dead=true; phys.caught++; playSound('pop');
        for(let q=0;q<24;q++){ const ang=rnd(0,6.283), sp=rnd(100,400); fx.push(particle({kind:'dot',x:b.x,y:b.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,drag:2,life:0.5,r:2.5,color:'#ffd23f',shrink:true,fade:0.3})); }
        const bx=b.x, by=b.y; fx.push(entity(1,function(){ g.save(); g.globalAlpha=1-this.age; g.font='700 28px system-ui,sans-serif'; g.textAlign='center'; g.fillStyle='#fff';
          g.strokeStyle='rgba(0,0,0,.7)'; g.lineWidth=4; g.strokeText('+1',bx,by-this.age*60); g.fillText('+1',bx,by-this.age*60); g.restore(); }));
        break; }
      // отбил: выталкиваем из ладони и отражаем относительную скорость, добавляя скорость руки
      const nx=d?dx/d:0, ny=d?dy/d:-1; b.x=h.c.x+nx*(R+b.r); b.y=h.c.y+ny*(R+b.r);

      if(Math.hypot(h.vx,h.vy)>250&&t-b.hit>150){ b.hit=t; playSound('pop');
        for(let q=0;q<8;q++) fx.push(particle({kind:'spark',x:b.x-nx*b.r,y:b.y-ny*b.r,vx:nx*rnd(100,400)+rnd(-100,100),vy:ny*rnd(100,400)+rnd(-100,100),drag:2,life:0.35,r:2,color:'#ffffff',fade:0.2})); }
    }
  }
}

// Анонимное чтение IRC (justinfan), без токена. Эмоуты Twitch берутся из тега emotes и грузятся с CDN; эмодзи — из текста.
const twitch={ws:null,state:'off',err:'',retryT:null,chan:''};
function twitchStatusText(){ return {off:'выключено',connecting:'подключаюсь…',ok:`#${twitch.chan} ✓`,error:twitch.err||'ошибка'}[twitch.state]; }
function twitchSet(state,err=''){ twitch.state=state; twitch.err=err; const e=document.getElementById('tw-status'); if(!e) return;
  e.textContent=twitchStatusText(); e.className='pill '+(state==='ok'?'st-ok':state==='error'?'st-err':''); }
function twitchConnect(){
  clearTimeout(twitch.retryT); if(twitch.ws){ const w=twitch.ws; twitch.ws=null; try{ w.close(); }catch{} }
  const chan=String(cfg.settings.chat.twitch||'').trim().replace(/^.*twitch\.tv\//i,'').replace(/^#/,'').replace(/[\/?#].*$/,'').toLowerCase(); twitch.chan=chan;
  if(!chan||!cfg.settings.phys.enabled){ twitchSet('off'); return; }
  let ws; try{ ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443'); }catch(e){ twitchSet('error',e.message); return; }
  twitch.ws=ws; twitchSet('connecting');
  ws.onopen=()=>{ ws.send('CAP REQ :twitch.tv/tags'); ws.send('PASS SCHMOOPIIE'); ws.send('NICK justinfan'+Math.floor(rnd(10000,99999))); ws.send('JOIN #'+chan); };
  ws.onmessage=ev=>{ for(const line of String(ev.data).split('\r\n')){ if(!line) continue;
    if(line.startsWith('PING')){ ws.send('PONG :tmi.twitch.tv'); continue; }
    if(/ JOIN #/.test(line)&&twitch.state!=='ok') twitchSet('ok');
    const m=line.match(/^(?:@(\S+) )?:\S+ PRIVMSG #\S+ :(.*)$/); if(m) twitchMessage(m[1]||'',m[2]); } };
  ws.onclose=()=>{ if(twitch.ws!==ws) return; twitch.ws=null; if(twitch.state!=='error') twitchSet('error','соединение потеряно, пробую снова…'); twitch.retryT=setTimeout(twitchConnect,5000); };
}
function twitchMessage(tags,text){
  const C=cfg.settings.chat; if(!cfg.settings.phys.enabled) return; let n=0;
  const tag=Object.fromEntries(tags.split(';').filter(Boolean).map(x=>{ const i=x.indexOf('='); return [x.slice(0,i),x.slice(i+1)]; }));
  if(C.emotes&&tag.emotes) for(const part of tag.emotes.split('/')){ const [id,ranges]=part.split(':'); if(!id||!ranges) continue;
    for(const _ of ranges.split(',')){ if(n++>=C.perMsg) break; physSpawn({url:`https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/3.0`}); } }
  if(C.emoji) for(const tk of emojiTokens(text)){ if(!isEmoji(tk)) continue; if(n++>=C.perMsg) break; physSpawn({ch:tk}); }
}

function loop(){
  const t=now(), dt=Math.min(0.05,(t-lastT)/1000); lastT=t;

  else if(isObsInput()&&hands.length&&t-shot.lastT>800){ hands=[]; processRules(t); }  // кадры перестали приходить
  g.clearRect(0,0,W,H);
  g.save();
  if(t<cam.shakeUntil){ const k=(cam.shakeUntil-t)/cam.shakeDur, sx=rnd(-1,1)*cam.shakeAmp*k, sy=rnd(-1,1)*cam.shakeAmp*k;
    g.translate(sx,sy); mediaLayer.style.transform=`translate(${sx}px,${sy}px)`; }
  else if(mediaLayer.style.transform) mediaLayer.style.transform='';
  drawCamera(t);

  drawGlitch(t);

  for(let i=fx.length-1;i>=0;i--){ if(!fx[i].update(dt)){ fx[i].dispose&&fx[i].dispose(); fx.splice(i,1); } }
  for(const e of fx) e.draw&&e.draw();
  if(fx.length>4000) for(const e of fx.splice(0,fx.length-4000)) e.dispose&&e.dispose();
  if(cfg.settings.debug) drawDebug(t);
  if(rec){ if(t<rec.start) drawOverlayText(String(Math.ceil((rec.start-t)/1000)),`Приготовься: ${rec.hands===2?'две руки':'одна рука'} в кадре`);
    else drawOverlayText('Запись…',`Держи жест и чуть двигай рукой · кадров: ${rec.samples.length}`); }
  if(statusMsg&&(!obsMode||!$('#panel').classList.contains('hidden'))) drawOverlayText('Gesture FX',statusMsg);
  if(t-detT>1000){ detRate=detCount*1000/(t-detT); detCount=0; detT=t; }

function exportCfg(){ const c=JSON.parse(JSON.stringify(cfg)); if(c.settings.obsWs) c.settings.obsWs.password=''; return c; }
function importConfig(text){
  try{ const c=JSON.parse(text); if(!c||!Array.isArray(c.rules)) throw new Error('нет rules');
    const d=defaultConfig(), pw=cfg.settings.obsWs?.password||'';
    cfg={...d,...c,settings:mergeSettings(d.settings,c.settings),customGestures:Array.isArray(c.customGestures)?c.customGestures:[],knobs:Array.isArray(c.knobs)?c.knobs:[]};
    if(!cfg.settings.obsWs.password) cfg.settings.obsWs.password=pw;
    save(); renderAll(); startCamera(); obsConnect(); initExtraModels(); twitchConnect(); toast('Конфиг загружен'); }catch(e){ toast('Не получилось: '+e.message); }
}

    face:(r,t)=>faceUpdate(r,t),pose:(r,t)=>poseUpdate(r,t),active:()=>activeNow,log:fireLog,hands:()=>hands,handLm,tracks,phys,events:dynEvents,
    models:()=>({recognizer:!!recognizer,face:!!faceLm,pose:!!poseLm,status:statusMsg}),snapshot:snapshotSample,save,renderAll,twitchMessage}};
document.body.classList.toggle('solid', !obsMode);

initModel();

twitchConnect();
mediaLoad().then(()=>{ renderLibrary(); renderRules(); preloadRuleMedia(); });
